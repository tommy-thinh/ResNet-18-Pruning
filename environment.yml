name: cnn
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - numpy==2.2.6
      - tensorflow[and-cuda]==2.20.0; platform_system == "Linux"
      - tensorflow==2.20.0; platform_system != "Linux"
      - keras==3.12.0
      - torch==2.9.0+cpu
      - matplotlib==3.10.7
      - huggingface-hub==0.36.0
